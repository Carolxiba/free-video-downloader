[project]
name = "shizhen-video-downloader"
version = "0.1.0"
description = "拾帧视频下载后端"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.14",
    "pydantic==2.11.7",
    "uvicorn[standard]==0.34.3",
    "yt-dlp[default]==2026.10.26",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
